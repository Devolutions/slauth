name: Build & Test Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build-rust:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  build-wasm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup wasm
      run: |
        curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        wasm-pack --version

    - name: Build
      run: sh build.sh
      working-directory: wrappers/wasm

  build-wasm-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup wasm
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Build
        run: bash build-web.sh
        working-directory: wrappers/wasm

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Set up JDK 1.8
      uses: actions/setup-java@v5
      with:
        java-version: 8
        distribution: adopt

    - name: Setup Android
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
        unzip android-ndk-r23b-linux.zip
        export ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r23b
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
        echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android" >> $GITHUB_ENV::LIBRARY_PATH
        echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android" >> $GITHUB_ENV::LD_LIBRARY_PATH
        rustup target add aarch64-linux-android
        rustup target add x86_64-linux-android
        rustup target add x86_64-unknown-linux-gnu

    - name: Build
      run: sh wrappers/android/build.sh

  build-swift:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup rust
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-ios-sim
          rustup target add aarch64-apple-darwin

      - name: Generate package
        run: sh wrappers/swift/build.sh

  build-dotnet:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup rust
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc

      # ring needs a C compiler to cross-compile aarch64; the runner ships LLVM but not on PATH.
      - name: Expose LLVM
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Configure .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Builds both Windows natives, runs the managed tests against the real C ABI, then packs.
      - name: Generate package
        run: ./build.ps1
        shell: pwsh
        working-directory: wrappers/dotnet